name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plumed:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OPENMM_CPU_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          init-shell: bash
      - name: Build the native action
        run: bash build.sh
      - name: Run numerical, reference and example tests
        run: bash test.sh --junitxml=validation/ci-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: validation/ci-tests.xml
